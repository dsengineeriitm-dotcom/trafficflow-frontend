<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traffic Infrastructure Planner</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080c14;
      --bg2: #0d1421;
      --bg3: #111927;
      --surface: #151e2e;
      --surface2: #1a2438;
      --border: rgba(99,179,237,0.12);
      --border2: rgba(99,179,237,0.22);
      --accent: #00d4ff;
      --accent2: #7c3aed;
      --accent3: #f59e0b;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
      --text: #e8f4fd;
      --text2: #94b8d4;
      --text3: #5a7a94;
      --font: 'Space Grotesk', sans-serif;
      --font-display: 'Syne', sans-serif;
      --radius: 12px;
      --radius-lg: 18px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --glow: 0 0 30px rgba(0,212,255,0.15);
    }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
    #root { min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    .leaflet-container { background: #080c14 !important; }
    .leaflet-tile { filter: brightness(0.7) saturate(0.6) hue-rotate(200deg); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
